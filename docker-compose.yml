services:
  postgres:
    image: postgres:17-alpine
    container_name: lgurd-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lgurd_user
      POSTGRES_PASSWORD: lgurd_password
      POSTGRES_DB: lgurd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lgurd_user -d lgurd_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lgurd-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lgurd-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Database (uses Docker service name 'postgres' for internal networking)
      - DATABASE_URL=postgresql://lgurd_user:lgurd_password@postgres:5432/lgurd_db?schema=public
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      # Stripe (load from .env.local or use placeholder - replace with your keys)
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-sk_test_PLACEHOLDER_REPLACE_WITH_YOUR_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-whsec_PLACEHOLDER_REPLACE_WITH_YOUR_SECRET}
      # Resend (load from .env.local or use placeholder - replace with your key)
      - RESEND_API_KEY=${RESEND_API_KEY:-re_PLACEHOLDER_REPLACE_WITH_YOUR_KEY}
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lgurd-network

volumes:
  postgres_data:

networks:
  lgurd-network:
    driver: bridge
